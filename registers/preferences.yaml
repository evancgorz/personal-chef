    vehicle_color: white
    display_label: white truck
    source: user-confirmed
    rule: Use the white truck detail for future pickup identification unless the user gives a different instruction; do not modify an already placed order unless explicitly asked.
interaction:
  primary_interface: mobile_app
  desktop_browser_visible_to_user: false
  chat_updates_required: true
  communication_rule: Summarize all decision-relevant retailer state, material cart changes, substitutions, fulfillment options, fees, blockers, and approval requests in chat; do not ask the user to inspect the desktop browser.
