issues:
  - id: issue-2026-09-25-food-lion-session-checkout-error
    opened_at: 2026-09-25T11:50:00-04:00
    status: resolved
    severity: medium
    category: checkout
    summary: Food Lion returned a generic checkout error and then reported the account was logged in on another device.
    impact: The first purchase attempt did not create an order and cleared the selected pickup time.
    mitigation: Check Past Orders before retrying to avoid a duplicate order, sign in again, reselect the approved window, and reverify the unchanged cart and total.
