    severity: medium
    category: substitution
    summary: Agent accepted a missing celery item instead of selecting the next-best pre-washed or partially cut celery equivalent for a hands-off delivery order.
    impact: Initial stew delivery order omitted celery even though a reasonable convenient substitute was available.
    mitigation: Apply the durable ordinary-ingredient auto-substitution policy; search adjacent forms and cuts of the same ingredient before accepting an omission.
    recoverability: Order was still editable; the user authorized an amendment before preparation began.
    resolved_at: 2026-09-07T20:16:17-04:00
    resolution: Added Jean's Classy Fresh Celery Sticks 8 oz bag to the scheduled delivery order; amended estimated total is $43.50.
  - id: issue-2026-09-07-delivery-window-change-ui
