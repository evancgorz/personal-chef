instructions:
  - Pour the broth into the Instant Pot. Add the chicken thighs, sliced celery, peppers and onions, drained cannellini beans, garlic, Italian seasoning, crushed red pepper, salt, and black pepper. Layer the diced tomatoes on top without stirring.
  - Lock the lid and cook on high pressure for 12 minutes. Allow a 10-minute natural release, then vent the remaining pressure. Confirm the chicken reaches 165 F.
  - Transfer the chicken to a plate, shred it with two forks, and return it to the pot.
  - Stir in the kale. Use saute for 2 to 3 minutes, stirring, until tender, then turn off the pot.
  - Stir in the lemon zest and juice. Taste and adjust salt and pepper. Serve with Parmesan if desired.
