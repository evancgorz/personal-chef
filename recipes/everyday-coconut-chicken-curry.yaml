instructions:
  - Complete mise en place: cut the chicken into 1-inch pieces and measure all curry ingredients before heating the skillet.
  - Prepare the microwave-ready basmati rice according to its package directions and keep warm.
  - Heat the avocado oil in a large skillet over medium-high heat. Cook the diced onion, garlic, and ginger for 2 to 3 minutes until fragrant.
  - Add the curry powder and cook for 30 seconds. Add the chicken and salt; brown for 3 to 4 minutes.
  - Add the coconut milk and chicken stock. Simmer for 12 to 15 minutes, until the chicken reaches 165 F and the sauce thickens slightly.
  - Stir in the peas and baby spinach. Cook for 2 to 3 minutes, until hot and wilted.
  - Fold in the cilantro and serve over the rice.
