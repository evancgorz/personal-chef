instructions:
  - Heat the oven to 425 F and line or lightly oil a sheet pan.
  - Toss the broccoli and green beans with half the olive oil, half the garlic, half the seasoning, salt, and pepper.
  - Coat the chicken with the remaining oil, garlic, seasoning, and the juice of one lemon.
  - Arrange everything in a single layer and roast until the chicken reaches 165 F, approximately 18 to 25 minutes.
  - Finish with the remaining lemon and adjust seasoning.
