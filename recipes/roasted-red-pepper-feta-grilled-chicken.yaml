instructions:
  - Complete mise en place: slice the zucchini lengthwise, cut the onions into wedges, drain the peppers, chop the dill, and measure the seasonings and sauce ingredients.
  - Heat the grill to medium-high, about 400 to 450 F.
  - Toss the zucchini and onions with 2 tbsp oil, 1/2 tsp salt, and 1/4 tsp black pepper.
  - Season the chicken with smoked paprika, oregano, red pepper flakes, 1 tsp salt, 1/2 tsp black pepper, and 1 tbsp oil.
  - Grill the chicken for 5 to 7 minutes per side until it reaches 165 F. Grill the zucchini and onions for 3 to 5 minutes per side until tender and charred.
  - Blend the roasted peppers, yogurt, feta, garlic, tomato paste, 4 tbsp olive oil, dill, remaining 1/2 tsp salt, and remaining 1/4 tsp black pepper until smooth.
  - Rest the chicken for 5 minutes, then slice and serve with the sauce and grilled vegetables.
