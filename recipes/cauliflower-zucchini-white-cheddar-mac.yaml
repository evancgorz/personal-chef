instructions:
  - Heat the grill for direct high heat. Peel and roughly chop the zucchini; measure all remaining ingredients. Bring a large pot of salted water to a boil.
  - Steam or microwave the cauliflower and zucchini until very tender, about 8 to 10 minutes. Blend until completely smooth, adding a small splash from the measured milk only if needed.
  - Pat the steaks dry. Rub with the avocado oil, 1 tsp kosher salt, and black pepper. Grill over direct high heat, turning once, until they reach the preferred doneness; for medium-rare, remove at 130 to 135 F. Rest for 5 to 10 minutes.
  - Cook the macaroni in the salted boiling water until just al dente. Reserve 1/2 cup pasta water, then drain.
  - Melt the butter in a medium saucepan over medium-low heat. Stir in the flour and cook for 2 minutes without browning.
  - Gradually whisk in the remaining milk. Simmer gently until smooth and thickened, 3 to 4 minutes. Remove from heat and stir in the white cheddar and remaining 1 tsp kosher salt until melted.
  - Whisk the blended cauliflower and zucchini into the cheese sauce until completely smooth. Fold in the macaroni, loosening with reserved pasta water as needed. Serve beside the rested sirloin steaks.
