lessons:
  - The overall meal-to-order sequence is stable; most remaining ambiguity comes from implicit next-action ownership and context-dependent short replies.
  - A run status describes what happened, while a handoff must separately state who acts next and what event advances the process.
  - Deterministic conversational flow should reduce user prompts, not add approval gates for reversible work.
  - Recipe and printable-card content still need a single structured source to eliminate drift.
