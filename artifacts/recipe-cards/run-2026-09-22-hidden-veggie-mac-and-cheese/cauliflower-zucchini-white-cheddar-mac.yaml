steps:
  - Heat the grill for direct high heat. Peel and roughly chop zucchini (<b>2 medium</b>); measure frozen cauliflower (<b>12 oz</b>), butter (<b>2 tbsp</b>), all-purpose flour (<b>2 tbsp</b>), 2% milk (<b>1 cup</b>), and shredded white cheddar (<b>4 1/2 oz</b>). Bring a large pot of salted water to a boil.
  - Steam or microwave the frozen cauliflower (<b>12 oz</b>) and peeled, chopped zucchini (<b>2 medium</b>) until very tender, about 8-10 minutes. Blend until completely smooth, adding a small splash from the measured 2% milk (<b>1 cup total</b>) only if needed.
  - Pat the grass-fed top sirloin steaks (<b>6 steaks, 6 oz each</b>) dry. Rub with avocado oil (<b>1 tbsp</b>), kosher salt (<b>1 tsp</b>), and black pepper (<b>1 tsp</b>). Grill over direct high heat, turning once, until they reach your preferred doneness; for medium-rare, remove at 130-135 F. Rest 5-10 minutes.
  - Cook elbow macaroni (<b>9 oz dry</b>) in the salted boiling water until just al dente. Reserve 1/2 cup pasta water, then drain.
  - Melt butter (<b>2 tbsp</b>) in a medium saucepan over medium-low heat. Stir in all-purpose flour (<b>2 tbsp</b>) and cook for 2 minutes without browning.
  - Gradually whisk in the remaining 2% milk (<b>from 1 cup total</b>). Simmer gently until smooth and thickened, 3-4 minutes. Remove from heat and stir in shredded white cheddar (<b>4 1/2 oz</b>) and kosher salt (<b>1 tsp</b>) until melted.
  - Whisk the blended frozen cauliflower (<b>12 oz</b>) and zucchini (<b>2 medium</b>) into the white cheddar sauce until completely smooth. Fold in the cooked elbow macaroni (<b>9 oz dry before cooking</b>), loosening with reserved pasta water as needed. Serve beside the rested grass-fed top sirloin steaks (<b>6 steaks</b>).
tip: "SMOOTH SAUCE: Blend the vegetables while hot and add the cheddar off heat to keep the sauce silky."
