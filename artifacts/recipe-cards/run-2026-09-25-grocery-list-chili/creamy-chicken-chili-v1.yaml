steps:
  - Open and drain the cooked canned chicken breast (<b>2 x 12.5 oz cans</b>). Drain and rinse the no-salt-added black beans (<b>2 x 15.5 oz cans</b>), no-salt-added kidney beans (<b>2 x 15.5 oz cans</b>), and whole-kernel corn (<b>1 x 15 oz can</b>). Open the diced tomatoes (<b>1 x 14.5 oz can, keep juices</b>) and mild chopped green chiles (<b>1 x 4 oz can</b>). Cube the cream cheese (<b>8 oz</b>).
  - In a large pot, combine the fresh pre-diced yellow onion (<b>5 oz</b>), unsalted chicken bone broth (<b>4 cups</b>), diced tomatoes with juices (<b>1 x 14.5 oz can</b>), mild chopped green chiles (<b>1 x 4 oz can</b>), and taco seasoning (<b>2 x 1 oz packets</b>). Bring to a boil, then cover and simmer over medium-low heat for 8 minutes to soften the onion.
  - Stir in the drained cooked canned chicken breast (<b>2 x 12.5 oz cans</b>), rinsed no-salt-added black beans (<b>2 x 15.5 oz cans</b>), rinsed no-salt-added kidney beans (<b>2 x 15.5 oz cans</b>), and rinsed whole-kernel corn (<b>1 x 15 oz can</b>). Simmer uncovered for 12-15 minutes, stirring occasionally, until the chili is hot throughout and the chicken reaches 165 F.
  - Reduce heat to low. Whisk in cubed cream cheese (<b>8 oz</b>) until fully melted and smooth, about 3-5 minutes. Divide among 8 bowls and top with Mexican-blend shredded cheese (<b>8 oz total</b>).
tip: "MAKE AHEAD: Refrigerate leftovers promptly and reheat until steaming hot."
