      publisher: Skinnytaste
      url: https://www.skinnytaste.com/butternut-squash-mac-and-cheese/
      accessed_at: 2026-09-22T06:24:00-04:00
      adaptation: Use pre-cut squash, retain the source's fully blended squash sauce, and add a modest amount of smoked gouda and sage for a sweet-smoky steakhouse profile. Size it as a side; no protein boost is needed alongside sirloin.
    - recipe_id: three-veg-baked-mac
      title: Vegetable macaroni cheese with three hidden veg
      publisher: Sneaky Veg
      url: https://www.sneakyveg.com/hidden-vegetable-macaroni-cheese/
      accessed_at: 2026-09-22T06:24:00-04:00
      adaptation: Scale to six side servings; use frozen cauliflower and pre-cut sweet potato and squash where available, preserve the source's smooth blended sauce, use sharp cheddar so the cheese flavor stands up to the higher vegetable load, and keep the optional breadcrumb bake.
